    .button span { font-size: 15px; font-weight: 550; opacity: .95; }
    .button:hover { background: #116a7d; border-color: #116a7d; }
    .button:active { transform: translateY(1px); }
    .button:focus-visible { outline: 4px solid #86cfda; outline-offset: 4px; }
    .footer { margin: 23px 0 0; color: #8499a1; font-size: 12px; line-height: 1.6; }
  </style>
</head>
